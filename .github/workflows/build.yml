name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "What to publish after the builds finish"
        type: choice
        options:
          - build-only
          - tagged-release
          - continuous-QT6
        default: build-only
        required: true
      release_tag:
        description: "Tag to create for tagged-release mode"
        type: string
        required: false
      notify_discord:
        description: "Send a Discord notification after a successful QT6WIP build"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libusb-1.0-0-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libfuse2 \
            pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10"
          modules: "qtserialbus qtserialport"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DPREFIX=/usr
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Compile translations
        run: |
          for translation in translations/*.ts; do
            lrelease "$translation"
          done

      - name: Install into AppDir
        run: |
          DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build
          mkdir -p AppDir/usr/share/savvycan/translations
          cp translations/*.qm AppDir/usr/share/savvycan/translations/

      - name: Build AppImage
        run: |
          wget --quiet --show-progress \
            https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage \
            AppDir/usr/share/applications/SavvyCAN.desktop \
            -appimage \
            -extra-plugins=iconengines,platformthemes/libqgtk3.so,canbus,tls

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Linux-x86_64
          path: SavvyCAN-*.AppImage
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt
        run: |
          brew install qt@6 cmake
          brew link qt@6 --force --overwrite

      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          cmake --build build --config Release --parallel 2

      - name: Package DMG
        run: |
          for translation in translations/*.ts; do
            lrelease "$translation"
          done
          mkdir -p build/SavvyCAN.app/Contents/MacOS/translations
          mkdir -p build/SavvyCAN.app/Contents/MacOS/help
          mkdir -p build/SavvyCAN.app/Contents/PlugIns/canbus
          mkdir -p build/SavvyCAN.app/Contents/PlugIns/tls
          cp translations/*.qm build/SavvyCAN.app/Contents/MacOS/translations/
          cp -R help/. build/SavvyCAN.app/Contents/MacOS/help/
          cp -R "$(brew --prefix qt@6)/plugins/canbus/." build/SavvyCAN.app/Contents/PlugIns/canbus/
          cp -R "$(brew --prefix qt@6)/plugins/tls/." build/SavvyCAN.app/Contents/PlugIns/tls/
          macdeployqt build/SavvyCAN.app -dmg
          mv build/SavvyCAN.dmg "SavvyCAN-macOS-${{ matrix.arch }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-macOS-${{ matrix.arch }}
          path: SavvyCAN-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10"
          modules: "qtserialbus qtserialport"

      - name: Install libusb
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libusb:x64-windows'

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DLIBUSB_INCLUDE_DIR="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/libusb-1.0" `
            -DLIBUSB_LIBRARY="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/libusb-1.0.lib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows application
        shell: pwsh
        run: |
          $package = Join-Path $PWD "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --dir $package "build/Release/SavvyCAN.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path "$package/translations", "$package/help", "$package/examples", "$package/plugins/canbus", "$package/plugins/tls" | Out-Null
          Get-ChildItem translations -Filter *.ts | ForEach-Object {
            & "$env:QT_ROOT_DIR/bin/lrelease.exe" $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item translations/*.qm "$package/translations/"
          Copy-Item help/* "$package/help/" -Recurse
          Copy-Item examples/* "$package/examples/" -Recurse
          Copy-Item "$env:QT_ROOT_DIR/plugins/canbus/*" "$package/plugins/canbus/" -Recurse
          Copy-Item "$env:QT_ROOT_DIR/plugins/tls/*" "$package/plugins/tls/" -Recurse
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/libusb-1.0.dll" $package

          Compress-Archive -Path "$package/*" -DestinationPath "SavvyCAN-Windows-x86_64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Windows-x86_64
          path: SavvyCAN-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    runs-on: ubuntu-22.04
    needs: [linux, macos, windows]
    if: inputs.publish == 'tagged-release'
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: SavvyCAN-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "release_tag is required when publish is tagged-release." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --generate-notes

  continuous-release:
    name: Update QT6WIP continuous release
    runs-on: ubuntu-22.04
    needs: [linux, macos, windows]
    if: inputs.publish == 'continuous-QT6'
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: SavvyCAN-*
          merge-multiple: true

      - name: Create or update continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != "QT6WIP" ]; then
            echo "Run this release mode from the QT6WIP branch." >&2
            exit 1
          fi
          if gh release view continuous-QT6 >/dev/null 2>&1; then
            gh release upload continuous-QT6 release-assets/* --clobber
          else
            gh release create continuous-QT6 release-assets/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "QT6 Development Build" \
              --notes "Automated build from QT6WIP."
          fi

  notify-discord:
    name: Notify Discord
    runs-on: ubuntu-22.04
    needs: [linux, macos, windows]
    if: inputs.notify_discord

    steps:
      - name: Send build notification when configured
        env:
          WEBHOOK_ID: ${{ secrets.WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_ID" ] || [ -z "$WEBHOOK_TOKEN" ]; then
            echo "Discord webhook secrets are not configured; skipping notification."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          commit_message = event.get("head_commit", {}).get("message", "Build completed")
          commit_message = commit_message.replace("\r", " ").replace("\n", " - ")
          payload = {
              "embeds": [{
                  "title": f"{os.environ['REPOSITORY']} QT6 Build Complete",
                  "description": (
                      f"{commit_message}\nCommit: {os.environ['SHA']}\n"
                      f"[Build Artifacts](https://github.com/{os.environ['REPOSITORY']}"
                      f"/actions/runs/{os.environ['RUN_ID']}#artifacts)"
                  ),
                  "color": 5131997,
                  "author": {"name": "GitHub Builds"},
              }]
          }
          with open("discord-payload.json", "w", encoding="utf-8") as payload_file:
              json.dump(payload, payload_file)
          PY

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data-binary @discord-payload.json \
            "https://discord.com/api/webhooks/$WEBHOOK_ID/$WEBHOOK_TOKEN"
